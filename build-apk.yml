name: Gerar APK do HelpMe! (Android)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Criar o projeto Android
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx capacitor-assets generate --android --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#ffffff' --splashBackgroundColor '#ffffff' --splashBackgroundColorDark '#141B30'

      - name: Ajustar cores das barras e número da versão
        run: |
          cat > android/app/src/main/res/values/helpme_colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="helpme_bars">#141B30</color>
          </resources>
          EOF
          sed -i 's#<item name="android:background">@null</item>#<item name="android:background">@null</item>\n        <item name="android:windowBackground">@color/helpme_bars</item>#' android/app/src/main/res/values/styles.xml
          sed -i "s/versionCode 1$/versionCode ${GITHUB_RUN_NUMBER}/" android/app/build.gradle
          grep -n "windowBackground" android/app/src/main/res/values/styles.xml
          grep -n "versionCode" android/app/build.gradle

      - name: Copiar o app (www) para o projeto Android
        run: npx cap sync android

      - name: Usar sempre a mesma chave de assinatura
        run: |
          mkdir -p "$HOME/.android"
          cp android-debug.keystore "$HOME/.android/debug.keystore"
          if [ -n "${ANDROID_USER_HOME:-}" ]; then mkdir -p "$ANDROID_USER_HOME"; cp android-debug.keystore "$ANDROID_USER_HOME/debug.keystore"; fi

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Empacotar APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk HelpMe-demo.apk
          ls -lh HelpMe-demo.apk
          keytool -printcert -jarfile HelpMe-demo.apk | grep -E "Owner|SHA256" || true

      - uses: actions/upload-artifact@v4
        with:
          name: HelpMe-demo-apk
          path: HelpMe-demo.apk
          retention-days: 30
