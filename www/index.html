<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no, email=no, address=no">
<meta name="color-scheme" content="light dark">
<title>HelpMe!</title>
<meta name="description" content="Demo navegável do HelpMe!">
<style>
@font-face{font-family:'Manrope';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/manrope-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Manrope';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/manrope-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Manrope';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/manrope-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Manrope';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/manrope-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Manrope';font-style:normal;font-weight:800;font-display:swap;src:url(fonts/manrope-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:'Source Serif 4';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/source-serif-4-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Source Serif 4';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/source-serif-4-latin-700-normal.woff2) format('woff2')}

/* ---- ajustes do app de iPhone ---- */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{overscroll-behavior:none}
*{-webkit-tap-highlight-color:transparent}
button,label,.chip,.tile,.navbar,.demobar,.seg,.badge{-webkit-user-select:none;user-select:none}
img{max-width:100%;-webkit-touch-callout:none}
[hidden]:not([hidden=until-found i]){display:none!important}
/* iOS antigo (antes do 16.2) não entende color-mix() */
@supports not (color: color-mix(in srgb, red 50%, blue)){
  .appbar{background:var(--bg)!important}
  .navbar{background:var(--surface)!important}
  .opt.on{background:var(--orange-soft)!important}
  .rec-cat.best,.tile:hover{border-color:var(--orange)!important}
}

</style>
<style>
/* Layout: desktop = demo rail (left) + app column (phone width for cliente/profissional, wide for admin).
   Mobile = slim demo bar on top + full-width app column. Identity "Confiança Urbana": navy institucional + laranja de ação. */
:root{
  --navy:#141B30; --navy-2:#1E2947; --navy-3:#2A3760;
  --orange:#FF6A2B; --orange-2:#FF8752; --orange-ink:#C2410C; --orange-soft:#FFEDE3;
  --bg:#F4F5F8; --surface:#FFFFFF; --surface-2:#EEF0F5; --surface-3:#E6E9F0;
  --line:#E2E5EC; --ink:#141B30; --muted:#636B80; --faint:#8A91A5;
  --good:#15803D; --good-bg:#E3F4E8; --warn:#B45309; --warn-bg:#FDF0DD; --bad:#B91C1C; --bad-bg:#FBE4E4; --info:#2F4A9A; --info-bg:#E8ECF7;
  --hero:#141B30; --hero-ink:#FFFFFF; --hero-muted:#A9B3CF; --hero-line:#2A3558;
  --shadow:0 1px 2px rgba(20,27,48,.05),0 8px 24px rgba(20,27,48,.07);
  --shadow-lg:0 2px 6px rgba(20,27,48,.08),0 24px 60px rgba(20,27,48,.18);
  --serif:'Source Serif 4',Georgia,'Times New Roman',serif;
  --sans:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:16px; --r-sm:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1222; --surface:#161D33; --surface-2:#1D2540; --surface-3:#25304F;
    --line:#29334F; --ink:#EEF0F6; --muted:#9AA3BA; --faint:#7A839B;
    --orange-soft:#3A2418; --orange-ink:#FF9A6B;
    --good:#4ADE80; --good-bg:#14301F; --warn:#FBBF24; --warn-bg:#33270E; --bad:#F87171; --bad-bg:#3A1717; --info:#9DB0F0; --info-bg:#1E2747;
    --hero:#1E2947; --hero-ink:#FFFFFF; --hero-muted:#AEB8D6; --hero-line:#33406A;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    --shadow-lg:0 2px 6px rgba(0,0,0,.4),0 24px 60px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1222; --surface:#161D33; --surface-2:#1D2540; --surface-3:#25304F;
  --line:#29334F; --ink:#EEF0F6; --muted:#9AA3BA; --faint:#7A839B;
  --orange-soft:#3A2418; --orange-ink:#FF9A6B;
  --good:#4ADE80; --good-bg:#14301F; --warn:#FBBF24; --warn-bg:#33270E; --bad:#F87171; --bad-bg:#3A1717; --info:#9DB0F0; --info-bg:#1E2747;
  --hero:#1E2947; --hero-ink:#FFFFFF; --hero-muted:#AEB8D6; --hero-line:#33406A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --shadow-lg:0 2px 6px rgba(0,0,0,.4),0 24px 60px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{margin:0;text-wrap:balance}
p{margin:0}
.serif{font-family:var(--serif);font-weight:700;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.small{font-size:12.5px} .xs{font-size:11.5px}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--orange)}
.eyebrow.dim{color:var(--hero-muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-sm{display:flex;flex-direction:column;gap:8px}
.stack-lg{display:flex;flex-direction:column;gap:20px}
.row{display:flex;align-items:center;gap:10px}
.row-top{display:flex;align-items:flex-start;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.center{text-align:center}
.hide{display:none!important}
svg.i{width:20px;height:20px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
svg.i.fill{fill:currentColor;stroke:none}

/* ---------- shell ---------- */
.shell{display:flex;justify-content:center;align-items:flex-start;gap:28px;padding-block:24px 40px;padding-inline:16px;min-height:100vh}
.rail{width:300px;flex-shrink:0;position:sticky;top:calc(24px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:14px}
.rail-brand{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:12px;background:#fff;object-fit:cover;flex-shrink:0;box-shadow:0 0 0 1px var(--line)}
.logo.sm{width:34px;height:34px;border-radius:10px}
.rail-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.role-switch{display:grid;grid-template-columns:1fr;gap:6px}
.role-btn{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;text-align:left;border:1px solid transparent;transition:background .15s,border-color .15s}
.role-btn:hover{background:var(--surface-2)}
.role-btn.on{background:var(--hero);color:var(--hero-ink);border-color:var(--hero)}
.role-btn.on .muted{color:var(--hero-muted)}
.role-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);color:var(--ink)}
.role-btn.on .role-ic{background:var(--orange);color:#1a0e07}
.guide{background:var(--hero);color:var(--hero-ink);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.guide .who{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--orange-2)}
.guide p{color:var(--hero-muted);font-size:13px}
.guide b{color:#fff}
.scen{display:flex;flex-direction:column;gap:2px;max-height:300px;overflow:auto}
.scen button{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:10px;text-align:left;font-size:13px;font-weight:600}
.scen button:hover{background:var(--surface-2)}
.scen .dot{width:26px;height:26px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;color:var(--orange-ink);flex-shrink:0}
.scen .dot svg{width:15px;height:15px}

.demobar{display:none}
.col{width:100%;max-width:440px;min-width:0;display:flex;flex-direction:column}
.col.wide{max-width:1120px}
.device{background:var(--bg);border-radius:30px;box-shadow:var(--shadow-lg);border:1px solid var(--line);overflow:clip;display:flex;flex-direction:column;min-height:calc(100vh - 64px);position:relative}
.col.wide .device{border-radius:22px}
.screen{flex:1;padding:16px;display:flex;flex-direction:column;gap:16px;padding-bottom:28px}
.appbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid transparent}
.appbar.line{border-bottom-color:var(--line)}
.appbar h1{font-size:17px;font-weight:800;font-family:var(--sans)}
.iconbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);position:relative;flex-shrink:0}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn .pip{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 2px var(--surface)}
.navbar{position:sticky;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px))}
.navbar button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:12px;font-size:11px;font-weight:700;color:var(--faint);position:relative}
.navbar button.on{color:var(--ink)}
.navbar button.on svg{color:var(--orange)}
.navbar .count{position:absolute;top:2px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--orange);color:#1a0e07;font-size:10px;display:grid;place-items:center}

/* ---------- admin layout ---------- */
.admin{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 64px)}
.aside{background:var(--hero);color:var(--hero-ink);padding:18px 12px;display:flex;flex-direction:column;gap:4px}
.aside .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.aside button{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--hero-muted);text-align:left}
.aside button:hover{background:rgba(255,255,255,.06);color:#fff}
.aside button.on{background:rgba(255,106,43,.16);color:#fff}
.aside button.on svg{color:var(--orange)}
.aside .badge{margin-left:auto}
.amain{padding:22px;display:flex;flex-direction:column;gap:18px;min-width:0}
.atabs{display:none}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px}
.kpi .v{font-family:var(--serif);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;font-weight:700}
.up{color:var(--good)} .down{color:var(--bad)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--surface-2)}

/* ---------- cards & blocks ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card.tight{padding:12px}
.card h2{font-size:16px;font-weight:800}
.card h3{font-size:14.5px;font-weight:800}
.hero{background:var(--hero);color:var(--hero-ink);border-radius:var(--r);padding:18px;position:relative;overflow:hidden}
.hero .muted{color:var(--hero-muted)}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;border:22px solid rgba(255,106,43,.14)}
.hero > *{position:relative;z-index:1}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec-h h2{font-family:var(--serif);font-size:20px;font-weight:700}
.link{color:var(--orange-ink);font-weight:700;font-size:13px}
.divider{height:1px;background:var(--line);margin:4px 0}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--muted)}
.kv .v{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.kv.total{border-top:1.5px solid var(--ink);border-bottom:0;padding-top:10px;margin-top:4px;font-size:15px}
.kv.total .k{color:var(--ink);font-weight:800}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.li:last-child{border-bottom:0}
.li .ic{width:38px;height:38px;border-radius:11px;background:var(--surface-2);display:grid;place-items:center;flex-shrink:0;color:var(--ink)}
.li .t{font-weight:700;font-size:14px}
.li .s{font-size:12.5px;color:var(--muted)}
button.li:hover{background:var(--surface-2);border-radius:10px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 18px;border-radius:14px;font-weight:800;font-size:14.5px;transition:transform .08s,background .15s,opacity .15s;white-space:nowrap}
.btn:active{transform:scale(.985)}
.btn.block{width:100%}
.btn.sm{height:36px;padding:0 12px;border-radius:10px;font-size:13px}
.btn.xs{height:30px;padding:0 10px;border-radius:9px;font-size:12px}
.btn-primary{background:var(--orange);color:#1a0e07}
.btn-primary:hover{background:var(--orange-2)}
.btn-dark{background:var(--navy);color:#fff}
:root[data-theme="dark"] .btn-dark{background:var(--navy-3)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn-dark{background:var(--navy-3)}}
.btn-ghost{background:var(--surface-2);color:var(--ink)}
.btn-ghost:hover{background:var(--surface-3)}
.btn-line{border:1.5px solid var(--line);color:var(--ink);background:var(--surface)}
.btn-danger{background:var(--bad-bg);color:var(--bad)}
.btn-good{background:var(--good-bg);color:var(--good)}
.btn[disabled]{opacity:.45;pointer-events:none}
.hero .btn-ghost{background:rgba(255,255,255,.1);color:#fff}
.btns{display:flex;gap:8px}
.btns > .btn{flex:1}

/* ---------- chips, badges ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:800;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.badge svg{width:13px;height:13px}
.b-good{background:var(--good-bg);color:var(--good)}
.b-warn{background:var(--warn-bg);color:var(--warn)}
.b-bad{background:var(--bad-bg);color:var(--bad)}
.b-info{background:var(--info-bg);color:var(--info)}
.b-orange{background:var(--orange-soft);color:var(--orange-ink)}
.b-dark{background:var(--navy);color:#fff}
.hero .badge{background:rgba(255,255,255,.1);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:7px 13px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-size:13px;font-weight:700;text-align:left}
.chip:hover{border-color:var(--faint)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
:root[data-theme="dark"] .chip.on{background:var(--orange);border-color:var(--orange);color:#1a0e07}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.on{background:var(--orange);border-color:var(--orange);color:#1a0e07}}
.chip.sm{min-height:30px;padding:4px 10px;font-size:12px}
.chip .lock{color:var(--faint)}
.hscroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}

/* ---------- home ---------- */
.addr{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:13.5px;padding:6px 10px 6px 8px;border-radius:999px;background:var(--surface);border:1px solid var(--line);max-width:100%}
.addr span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.greet h1{font-family:var(--serif);font-weight:700;font-size:30px;line-height:1.08;letter-spacing:-.015em}
.greet h1 em{font-style:normal;color:var(--orange)}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:6px 6px 6px 14px;box-shadow:var(--shadow)}
.search:focus-within{border-color:var(--orange)}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:0;height:40px;font-size:14.5px}
.search .go{height:40px;width:40px;border-radius:12px;background:var(--orange);color:#1a0e07;display:grid;place-items:center}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{aspect-ratio:1/1;background:var(--surface);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;padding:12px;text-align:left;transition:transform .12s,box-shadow .15s,border-color .15s;box-shadow:0 1px 2px rgba(20,27,48,.04);position:relative}
.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--orange) 40%,var(--line))}
.tile .tic{width:40px;height:40px;border-radius:12px;background:var(--orange-soft);color:var(--orange-ink);display:grid;place-items:center}
.tile .tic svg{width:22px;height:22px}
.tile .tn{font-weight:800;font-size:13px;line-height:1.2}
.tile.dark{background:var(--hero);border-color:var(--hero);color:#fff}
.tile.dark .tic{background:rgba(255,255,255,.1);color:#fff}
.tile.off{opacity:.5}
.tile .soon{position:absolute;top:10px;right:10px;font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.trust{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.trust .t{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px}
.trust .t svg{color:var(--orange-ink)}
.trust .t b{font-size:12.5px;line-height:1.2}
.trust .t span{font-size:11.5px;color:var(--muted);line-height:1.35}
.steps4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.steps4 .s{display:flex;flex-direction:column;gap:6px}
.steps4 .n{font-family:var(--serif);font-weight:700;color:var(--orange);font-size:20px}
.steps4 b{font-size:12.5px;line-height:1.25}
.steps4 span{font-size:11.5px;color:var(--muted);line-height:1.35}

/* ---------- forms ---------- */
.field{display:flex;flex-direction:column;gap:6px}
.field > label,.lbl{font-size:12.5px;font-weight:700;color:var(--muted)}
.input,.select,.textarea{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;font-size:14.5px;outline:0}
.input:focus,.select:focus,.textarea:focus{border-color:var(--orange)}
.textarea{min-height:84px;resize:vertical}
.stepper{display:inline-flex;align-items:center;gap:4px;background:var(--surface-2);border-radius:12px;padding:4px}
.stepper button{width:32px;height:32px;border-radius:9px;background:var(--surface);display:grid;place-items:center;border:1px solid var(--line)}
.stepper b{min-width:30px;text-align:center;font-variant-numeric:tabular-nums}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;height:36px;border-radius:9px;font-size:13px;font-weight:800;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(20,27,48,.12)}
.switch{width:46px;height:28px;border-radius:999px;background:var(--surface-3);position:relative;flex-shrink:0;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch.on{background:var(--good)}
.switch.on::after{transform:translateX(18px)}
.opt{display:flex;align-items:flex-start;gap:12px;padding:12px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);text-align:left;width:100%}
.opt.on{border-color:var(--orange);background:color-mix(in srgb,var(--orange-soft) 55%,var(--surface))}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--faint);flex-shrink:0;margin-top:1px;display:grid;place-items:center}
.opt.on .radio{border-color:var(--orange)}
.opt.on .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--orange)}
.check{width:20px;height:20px;border-radius:6px;border:2px solid var(--faint);flex-shrink:0;display:grid;place-items:center;margin-top:1px}
.check.on{background:var(--orange);border-color:var(--orange);color:#1a0e07}
.check.on::after{content:"";width:9px;height:5px;border-left:2.5px solid #1a0e07;border-bottom:2.5px solid #1a0e07;transform:rotate(-45deg) translate(1px,-1px)}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:13px;text-align:left}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.ph{width:76px;height:76px;border-radius:12px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line);position:relative}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph-add{width:76px;height:76px;border-radius:12px;border:1.5px dashed var(--faint);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer;background:var(--surface)}
.ph-add input{display:none}
.progress{height:6px;border-radius:6px;background:var(--surface-3);overflow:hidden}
.progress > i{display:block;height:100%;background:var(--orange);border-radius:6px;transition:width .3s}
.hero .progress{background:rgba(255,255,255,.12)}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.slot{height:42px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:800;font-size:13px;position:relative}
.slot.on{border-color:var(--navy);background:var(--navy);color:#fff}
.slot .pk{position:absolute;top:-7px;right:6px;font-size:9px;background:var(--orange);color:#1a0e07;padding:1px 5px;border-radius:6px}
.days{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.days::-webkit-scrollbar{display:none}
.day{min-width:58px;padding:8px 6px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:2px}
.day small{font-size:10.5px;font-weight:800;text-transform:uppercase;color:var(--muted);letter-spacing:.06em}
.day b{font-size:17px;font-family:var(--serif)}
.day.on{background:var(--navy);border-color:var(--navy);color:#fff}
.day.on small{color:var(--hero-muted)}

/* ---------- order / tracking ---------- */
.track{display:flex;gap:4px}
.track i{flex:1;height:5px;border-radius:5px;background:var(--surface-3)}
.track i.done{background:var(--good)}
.track i.now{background:var(--orange)}
.timeline{display:flex;flex-direction:column}
.tl{display:flex;gap:12px;position:relative;padding-bottom:14px}
.tl:last-child{padding-bottom:0}
.tl::before{content:"";position:absolute;left:5px;top:14px;bottom:0;width:2px;background:var(--line)}
.tl:last-child::before{display:none}
.tl .d{width:12px;height:12px;border-radius:50%;background:var(--good);margin-top:4px;flex-shrink:0;position:relative;z-index:1}
.tl .d.now{background:var(--orange);box-shadow:0 0 0 4px var(--orange-soft)}
.tl .tt{font-size:13px;font-weight:700}
.tl .ts{font-size:11.5px;color:var(--muted)}
.map{position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--surface-2);aspect-ratio:16/10}
.map svg{width:100%;height:100%;display:block}
.map .eta{position:absolute;left:12px;bottom:12px;background:var(--surface);border-radius:12px;padding:8px 12px;box-shadow:var(--shadow);display:flex;flex-direction:column}
.map .eta b{font-family:var(--serif);font-size:20px}
.pro{display:flex;align-items:center;gap:12px}
.av{width:48px;height:48px;border-radius:50%;background:var(--navy-2);color:#fff;display:grid;place-items:center;font-weight:800;font-size:16px;flex-shrink:0;position:relative}
.av.sm{width:36px;height:36px;font-size:13px}
.av.lg{width:64px;height:64px;font-size:22px}
.av .vf{position:absolute;right:-2px;bottom:-2px;width:18px;height:18px;border-radius:50%;background:var(--good);color:#fff;display:grid;place-items:center;border:2px solid var(--surface)}
.av .vf svg{width:10px;height:10px;stroke-width:3}
.stars{display:inline-flex;align-items:center;gap:3px;font-weight:800;font-size:13px}
.stars svg{width:14px;height:14px;color:var(--orange)}
.code{display:flex;gap:8px;justify-content:center}
.code span{width:52px;height:62px;border-radius:14px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--serif);font-size:30px;font-weight:700;border:1px solid var(--line)}
.hero .code span{background:rgba(255,255,255,.08);border-color:var(--hero-line);color:#fff}
.code-in{display:flex;gap:8px;justify-content:center}
.code-in input{width:52px;height:60px;text-align:center;font-family:var(--serif);font-size:26px;font-weight:700;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);outline:0}
.code-in input:focus{border-color:var(--orange)}
.radar{position:relative;width:180px;height:180px;margin:6px auto}
.radar i{position:absolute;inset:0;border-radius:50%;border:2px solid var(--orange);opacity:0;animation:ping 2.4s infinite}
.radar i:nth-child(2){animation-delay:.8s}
.radar i:nth-child(3){animation-delay:1.6s}
.radar .core{position:absolute;inset:60px;border-radius:50%;background:var(--orange);display:grid;place-items:center;color:#1a0e07;box-shadow:0 0 0 10px var(--orange-soft)}
@keyframes ping{0%{transform:scale(.35);opacity:.9}100%{transform:scale(1);opacity:0}}
.bubbles{display:flex;flex-direction:column;gap:8px}
.bub{max-width:78%;padding:9px 12px;border-radius:16px;font-size:13.5px;line-height:1.4}
.bub.me{align-self:flex-end;background:var(--navy);color:#fff;border-bottom-right-radius:6px}
.bub.them{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}
.bub.sys{align-self:center;background:transparent;color:var(--muted);font-size:11.5px;text-align:center}
.bub .t{display:block;font-size:10px;opacity:.6;margin-top:3px}
.composer{position:sticky;bottom:0;background:var(--bg);padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;border-top:1px solid var(--line)}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;font-size:13px;line-height:1.45}
.banner svg{margin-top:1px}
.banner.good{background:var(--good-bg);color:var(--good)}
.banner.warn{background:var(--warn-bg);color:var(--warn)}
.banner.bad{background:var(--bad-bg);color:var(--bad)}
.banner.info{background:var(--info-bg);color:var(--info)}
.banner.orange{background:var(--orange-soft);color:var(--orange-ink)}
.banner b{font-weight:800}
.sos{position:fixed;z-index:30}
.sosbtn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;background:var(--bad);color:#fff;font-size:12px;font-weight:800;letter-spacing:.06em}
.lvl{display:flex;align-items:center;gap:6px;font-weight:800;font-size:12.5px}
.lvl svg{width:14px;height:14px;color:var(--orange)}
.timer{font-family:var(--serif);font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.offer{border:1px solid var(--line);border-radius:16px;padding:14px;background:var(--surface);display:flex;flex-direction:column;gap:10px}
.offer.locked{background:var(--surface-2);border-style:dashed}
.price{font-family:var(--serif);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.price.lg{font-size:30px}
.big-ic{width:52px;height:52px;border-radius:16px;background:var(--orange-soft);color:var(--orange-ink);display:grid;place-items:center;flex-shrink:0}
.big-ic svg{width:26px;height:26px}
.ok-ic{width:64px;height:64px;border-radius:50%;background:var(--good-bg);color:var(--good);display:grid;place-items:center;margin:0 auto}
.ok-ic svg{width:32px;height:32px;stroke-width:2.4}
.bars{display:flex;align-items:flex-end;gap:8px;height:140px;padding-top:10px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars .b i{width:100%;max-width:34px;background:var(--navy-2);border-radius:8px 8px 3px 3px}
:root[data-theme="dark"] .bars .b i{background:var(--navy-3)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bars .b i{background:var(--navy-3)}}
.bars .b.hl i{background:var(--orange)}
.bars .b span{font-size:11px;color:var(--muted);font-weight:700}
.bars .b em{font-style:normal;font-size:11px;font-weight:800}
.hbar{display:flex;flex-direction:column;gap:4px}
.hbar .tr{height:8px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.hbar .tr i{display:block;height:100%;background:var(--orange);border-radius:6px}
.thumbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.thumbs .ph{width:100%;height:auto;aspect-ratio:1/1}
.acc summary{cursor:pointer;font-weight:700;padding:12px 0;list-style:none;display:flex;justify-content:space-between;gap:10px}
.acc summary::-webkit-details-marker{display:none}
.acc[open] summary svg{transform:rotate(90deg)}
.acc p{padding-bottom:12px;color:var(--muted);font-size:13.5px}
.acc{border-bottom:1px solid var(--line)}

/* ---------- overlays ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,14,28,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fadein .15s ease-out}
.sheet{width:100%;max-width:520px;max-height:88vh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadow-lg)}
.sheet .grab{width:42px;height:5px;border-radius:5px;background:var(--surface-3);margin:4px auto 12px}
.sheet-h{display:flex;align-items:flex-start;gap:10px;margin-bottom:14px}
.sheet-h h2{font-family:var(--serif);font-size:22px;font-weight:700;line-height:1.15}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:24px;max-height:84vh}}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--navy);color:#fff;padding:11px 16px;border-radius:14px;font-size:13.5px;font-weight:700;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:8px;max-width:calc(100vw - 32px);animation:up .2s ease-out}
.toast svg{color:var(--orange)}
.rec-cat{border:1px solid var(--line);border-radius:18px;background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:10px}
.rec-cat.best{border-color:color-mix(in srgb,var(--orange) 55%,var(--line));box-shadow:0 0 0 3px var(--orange-soft)}
.pulse{animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.45}}
.recdot{width:8px;height:8px;border-radius:50%;background:var(--bad);display:inline-block}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- responsive ---------- */
@media (max-width:1060px){
  .rail{display:none}
  .shell{padding:0;gap:0;display:block;min-height:0}
  .col,.col.wide{max-width:none}
  .device{border-radius:0;border:0;box-shadow:none;min-height:calc(100vh - 56px - env(safe-area-inset-top,0px))}
  .col.wide .device{border-radius:0}
  .demobar{display:flex;align-items:center;gap:8px;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:var(--hero);color:#fff;position:sticky;top:0;z-index:40}
  .demobar .seg{flex:1;background:rgba(255,255,255,.08)}
  .demobar .seg button{color:var(--hero-muted);height:32px;font-size:12px}
  .demobar .seg button.on{background:var(--orange);color:#1a0e07;box-shadow:none}
  .demobar .iconbtn{background:rgba(255,255,255,.08);border-color:transparent;color:#fff;width:34px;height:34px}
  .appbar{top:calc(52px + env(safe-area-inset-top,0px))}
  .col.client .device,.col.prov .device{max-width:560px;margin:0 auto;width:100%}
}
@media (max-width:860px){
  .admin{grid-template-columns:1fr;min-height:0}
  .aside{display:none}
  .atabs{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;background:var(--hero);scrollbar-width:none;position:sticky;top:calc(52px + env(safe-area-inset-top,0px));z-index:15}
  .atabs::-webkit-scrollbar{display:none}
  .atabs button{white-space:nowrap;padding:7px 12px;border-radius:999px;font-size:12.5px;font-weight:700;color:var(--hero-muted);background:rgba(255,255,255,.06)}
  .atabs button.on{background:var(--orange);color:#1a0e07}
  .amain{padding:16px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2,.grid3{grid-template-columns:1fr}
}
@media (max-width:380px){
  .greet h1{font-size:26px}
  .trust,.steps4{grid-template-columns:repeat(2,minmax(0,1fr))}
}

.rstar{padding:2px}
.rstar svg{width:38px;height:38px}

.hscroll .chip{white-space:nowrap;flex-shrink:0}

  if(!q || q.modo==='agora') return new Date();
  const d=new Date(startOfDay()+ (q.dia||0)*DAYMS); const [h,m]=(q.hora||'10:00').split(':'); d.setHours(+h,+m); return d;
}

function quote(d){ // d: {svc,tipo,det,quando,bairro}
  const sv=SV[d.svc], tp=sv.tipos.find(t=>t.id===d.tipo)||sv.tipos[0], P=S.db.pricing, det=d.det||{};

  else {
    lines.push([tp.nome, tp.base]);

  }
  const z=zoneOf(d.bairro||'Vila Madalena');
  const mult=[['Região · '+z.nome+(z.baixa?' (baixa cobertura)':''), z.fator]];
  if(isPeak(d.quando)) mult.push(['Horário de pico (noite ou fim de semana)', P.pico]);
  if((sv.demanda||1)!==1) mult.push(['Procura atual nesta categoria', sv.demanda]);
  const fator = mult.reduce((a,[,f])=>a*f,1);
  const bruto = sum(lines.map(l=>l[1]));
  let servico = Math.round(bruto*fator);
  const extras=[];
  if(det.urgente && sv.urgencia) extras.push(['Atendimento urgente · prioridade', P.urgencia]);
  if(det.recorrencia==='semanal') extras.push(['Assinatura semanal · 10% off', -Math.round(servico*0.10)]);
  if(det.recorrencia==='quinzenal') extras.push(['Assinatura quinzenal · 5% off', -Math.round(servico*0.05)]);
  servico += sum(extras.map(e=>e[1]));
  const taxa=P.taxaFixa;
  const mercado = visita ? null : [Math.round(bruto*0.9), Math.round(bruto*1.2)];
  return {modelo, visita, lines, mult, fator, extras, bruto, servico, taxa, total:servico+taxa, mercado, bonus: z.baixa? P.bonusDesloc:0};
}
function fromPrice(svcId){ const sv=SV[svcId]; const vals=sv.tipos.map(t=>{ const m=t.modelo||sv.modelo; return m==='visita' ? (t.visita??sv.visita??40) : t.base; }); return Math.min(...vals); }
function priceLabel(svcId){ const sv=SV[svcId]; const allVisit = sv.tipos.every(t=>(t.modelo||sv.modelo)==='visita'); return (allVisit?'Visita a partir de ':'A partir de ')+money0(fromPrice(svcId)); }

/* ================== RECOMENDAÇÃO ================== */
function recommend(text){
  const q=' '+norm(text)+' ';
  if(q.trim().length<2) return [];
  const words=q.trim().split(' ').filter(w=>w.length>2);
  const hit = kw => { const k=norm(kw); return q.includes(' '+k+' ') || q.includes(' '+k) || (k.length>4 && words.some(w=>w.startsWith(k.slice(0,5)))); };
  const res=[];
  for(const sv of Object.values(SV)){
    if(S.db.catOff[sv.id]) continue;
    const svHits=sv.kw.filter(hit);
    let best=null, bestScore=0, bestHits=[];
    for(const t of sv.tipos){ const h=(t.kw||[]).filter(hit); const sc=h.length*3; if(sc>bestScore){ best=t; bestScore=sc; bestHits=h; } }
    const score=svHits.length*2+(svHits.length?bestScore:bestScore/2);
    if(score>0) res.push({svc:sv.id, tipo:(best||sv.tipos[0]).id, score, why:[...new Set([...bestHits,...svHits])].slice(0,3)});
  }
  res.sort((a,b)=>b.score-a.score); const top=res[0]?.score||0;
  return res.filter(r=>r.score>=top*0.4).slice(0,4);
}

/* ================== ELEGIBILIDADE / MATCHING ================== */
function eligibility(p, o){
  if(p.status!=='aprovado') return {ok:false, why:'Perfil não aprovado'};
  if(!p.specs.includes(o.svc)) return {ok:false, why:'Fora das suas especialidades', hidden:true};
  const lvl=levelOf(p.xp).n, req=nivelReq(o.svc,o.tipo);
  if(lvl<req) return {ok:false, why:`Requer Nível ${req} · ${LEVELS[req-1].nome}`};
  const c=certReq(o.svc,o.tipo);
  if(c && p.certs[c]!=='valido') return {ok:false, why:`Requer ${CERTS[c]}`, cert:c};
  const eq=SV[o.svc].equip; if(eq && !p.equip.includes(eq)) return {ok:false, why:`Requer equipamento: ${eq}`};
  return {ok:true};
}
function offersFor(pid){
  const p=S.db.providers[pid];
  return S.db.orders.filter(o=>o.status==='buscando' && !(o.recusas||[]).includes(pid)).map(o=>({o, el:eligibility(p,o)})).filter(x=>!x.el.hidden);
}
function bestProviderFor(o, exclude=[]){
  return Object.values(S.db.providers).filter(p=>!exclude.includes(p.id) && eligibility(p,o).ok).sort((a,b)=>b.xp-a.xp || b.estrelas-a.estrelas)[0] || null;
}
function partnerFor(o, lead){
  const cands=Object.values(S.db.providers).filter(p=>p.id!==lead.id && p.specs.includes(o.svc) && p.status==='aprovado');
  // dupla: experiente + iniciante quando possível
  return cands.sort((a,b)=>a.xp-b.xp)[0] || null;
}

function decideDispute(d, how){

function submitOnboard(){
  const ob=S.onboard; const id='p'+(Object.keys(S.db.providers).length+1);
  S.db.providers[id]={id, nome:ob.nome, curto:ob.nome.split(' ')[0], demo:true, novo:true, xp:0, estrelas:5, nAval:0, servicos:0, aceite:100, specs:[...ob.specs], exp:{...ob.exp},
    certs:Object.fromEntries(Object.entries(ob.certs).map(([k,v])=>[k, v?'em_validacao':null])), equip:[...ob.equip], bairro:ob.bairro, raio:ob.raio, status:'em_analise', strikes:0, online:true,
    avaliacoes:[], carteira:{disp:0, extrato:[]}, nfsePend:0, seguro:false, mei:ob.mei||'Sem CNPJ', pix:ob.pix, recusados:[]};
  S.db.kyc.unshift({id:'K-'+(204+S.db.kyc.length), tipo:'cadastro', provId:id, nome:ob.nome, esp:[...ob.specs], doc:'CNH', bio:ob.bio||96, antecedentes:'Nada consta', cert:Object.fromEntries(Object.keys(ob.certs).filter(k=>ob.certs[k]).map(k=>[k,'enviado'])), mei:ob.mei||'Sem CNPJ', criado:Date.now(), status:'pendente', obs:''});
  S.db.notifs[id]=[]; notify('admin', `Novo cadastro para análise: ${ob.nome}`);
  S.prov.acc=id; S.prov.screen='pending'; S.prov.stack=[]; S.onboard=null; render(true);
}

function appbar(title, {back=true, right='', sub='', line=false}={}){
  return `<header class="appbar ${line?'line':''}">${back?`<button class="iconbtn" ${da('back')} aria-label="Voltar">${ic('chevL')}</button>`:''}
    <div class="grow"><h1>${title}</h1>${sub?`<div class="xs muted">${sub}</div>`:''}</div>${right}</header>`;
}
function bell(target){ const n=(S.db.notifs[target]||[]).filter(x=>!x.lido).length; return `<button class="iconbtn" ${da('notifs',target)} aria-label="Notificações">${ic('bell')}${n?'<span class="pip"></span>':''}</button>`; }
function avatar(p, cls=''){ return `<div class="av ${cls}">${initials(p.nome)}${p.status==='aprovado'?`<span class="vf">${ic('check')}</span>`:''}</div>`; }
function stars(v, n){ return `<span class="stars">${icStar()} ${(+v).toFixed(1).replace('.',',')}${n!=null?`<span class="muted" style="font-weight:600">&nbsp;(${n})</span>`:''}</span>`; }
function lvlChip(p){ const l=levelOf(p.xp); return `<span class="lvl">${ic('diamond')} Nível ${l.n} · ${l.nome}</span>`; }
function proCard(p, {sub='', right=''}={}){
  return `<div class="pro">${avatar(p)}<div class="grow"><div class="row" style="gap:6px"><b>${esc(p.nome)}</b></div>
    <div class="row wrap small muted" style="gap:8px;margin-top:2px">${stars(p.estrelas)} <span>·</span> ${lvlChip(p)} <span>·</span> <span>${p.servicos} serviços</span></div>${sub}</div>${right}</div>`;
}

  if(d.step===3){
    const cl=S.db.client; const end=cl.enderecos.find(e=>e.id===d.endId);
    const when = d.quando.modo==='agora' ? 'Agora' : dayLabel(slotDate(d.quando).getTime())+' às '+d.quando.hora;
    body=`<div class="card stack-sm"><h3>Resumo</h3>
      ${kv('Serviço', `${sv.nome} · ${tp.nome}`)}${kv('Quando', when)}${kv('Onde', esc(end.apelido)+' · '+esc(end.bairro))}
      ${sv.campos.includes('comodos')?kv('Tamanho', `${det.comodos} cômodos${sv.campos.includes('banheiros')?`, ${det.banheiros} banheiro${det.banheiros>1?'s':''}`:''}`):''}
      ${sv.campos.includes('andar')?kv('Acesso', `${det.andar===0?'Térreo':det.andar+'º andar'} · ${det.elevador?'com elevador':'sem elevador'}`):''}
      ${det.urgente?kv('Prioridade','Urgente'):''}${det.recorrencia&&det.recorrencia!=='avulso'?kv('Assinatura', det.recorrencia):''}
      ${det.fotos.length?kv('Fotos', det.fotos.length+' anexada'+(det.fotos.length>1?'s':'')):''}</div>
    ${priceCard(q)}
    <div class="stack-sm"><span class="lbl">Forma de pagamento</span>${cl.pagamentos.map(p=>opt(d.pag===p.id, `${ic(p.icon)} ${p.nome}`, p.id==='pix'?'Aprovação na hora':'Crédito à vista', 'dPag', p.id)).join('')}</div>
    <div class="banner good">${ic('lock')}<span><b>Pagamento protegido.</b> O valor fica retido e só é liberado ao profissional quando você informar o código final. Cancelamento grátis até alguém aceitar.</span></div>
    ${chk(d.aceite,'Concordo com os Termos de Uso, a política de cancelamento e o uso da minha localização e de fotos durante o serviço (LGPD).','dToggleRoot','aceite')}
    <button class="btn btn-primary block" ${da('reqPay')} ${d.aceite?'':'disabled'}>Pagar ${money(q.total)}</button>`;
  }
  return appbar('Novo pedido', {sub:`Passo ${d.step} de 3 · ${steps[d.step-1]}`, line:true}) + `<main class="screen"><div class="progress"><i style="width:${d.step/3*100}%"></i></div>${body}</main>`;
}

      ${ACTIVE.includes(st)?`<div class="btns"><button class="btn btn-ghost sm" ${da('openChat',o.id)}>${ic('chat')} Conversar</button><button class="btn btn-ghost sm" ${da('sheet','call:'+o.id)}>${ic('phone')} Ligar</button><button class="sosbtn" ${da('sheet','sos:'+o.id)}>${ic('alert')} SOS</button></div>`:''}</div>`:''}

  const demo=S.db.orders.filter(o=>o.created>Date.now()-30*DAYMS);

function pixQR(seed){ let x=0; for(const c of seed) x=(x*31+c.charCodeAt(0))>>>0; const n=25, cells=[]; const rnd=()=>{ x^=x<<13; x>>>=0; x^=x>>17; x^=x<<5; x>>>=0; return x/4294967296; };
  const fin=(r,c)=>(r<7&&c<7)||(r<7&&c>=n-7)||(r>=n-7&&c<7);
  for(let r=0;r<n;r++) for(let c=0;c<n;c++){ let on; if(fin(r,c)){ const rr=r%(n-7)===r?r:r-(n-7), cc=c<7?c:c-(n-7); const R=r<7?r:r-(n-7); const C=c<7?c:c-(n-7); on = R===0||R===6||C===0||C===6||(R>=2&&R<=4&&C>=2&&C<=4); } else on=rnd()>.52; if(on) cells.push(`<rect x="${c}" y="${r}" width="1" height="1"/>`); }
  return `<svg viewBox="-2 -2 29 29" style="width:190px;height:190px;background:#fff;border-radius:14px;display:block;margin:0 auto" aria-label="QR code Pix de exemplo"><g fill="#141B30">${cells.join('')}</g></svg>`; }
function sheetHTML(){
  const s=S.ui.sheet; if(!s) return '';
  const t=s.type; let h='';

/* ================== RENDER ================== */
function render(top=false){
  const root=document.getElementById('root');
  const sheetScroll=document.querySelector('.sheet')?.scrollTop||0;
  const hadSheet=!!document.querySelector('.sheet');
  root.innerHTML = shell() + sheetHTML();
  document.body.style.overflow = S.ui.sheet ? 'hidden' : '';
  if(hadSheet && S.ui.sheet){ const sh=document.querySelector('.sheet'); if(sh){ sh.style.animation='none'; sh.scrollTop=sheetScroll; } }
  if(top) window.scrollTo(0,0);
  tick();
}
function renderToast(){
  let el=document.getElementById('toast');
  if(!S.ui.toast){ if(el) el.remove(); return; }
  if(!el){ el=document.createElement('div'); el.id='toast'; document.body.appendChild(el); }
  el.className='toast'; el.innerHTML=ic(S.ui.toast.icon)+'<span>'+S.ui.toast.txt+'</span>';
}
function tick(){
  document.querySelectorAll('[data-eta]').forEach(el=>{ const o=getO(el.dataset.eta); if(o) el.textContent=etaLeft(o)+' min'; });
  document.querySelectorAll('[data-elapsed]').forEach(el=>{ const s=Math.max(0,Math.floor((Date.now()-(+el.dataset.elapsed))/1000)); el.textContent=pad(Math.floor(s/3600))+':'+pad(Math.floor(s/60)%60)+':'+pad(s%60); });
}
setInterval(tick, 1000);

/* ================== PROFISSIONAL SIMULADO ================== */
function autoStep(o){
  switch(o.status){
    case 'agendado': startTrip(o); return 'Profissional saiu para o atendimento';
    case 'a_caminho': arrive(o, o.cChegada); return 'Profissional chegou e digitou o código de chegada';
    case 'no_local':
      if(!o.fotosAntes.length) o.fotosAntes.push(makePhoto('Antes',30));
      if(o.modelo==='visita'){ const s=(SUG[o.svc]||[['Mão de obra do reparo',120,160]])[0]; sendBudget(o,{texto:'Avaliei no local. '+(o.det.descricao||''), itens:[{nome:'Mão de obra', valor:Math.round((s[1]+s[2])/2), tipo:'mao'},{nome:'Material', valor:45, tipo:'peca'}], pecasPor:'profissional'}); return 'Orçamento enviado'; }
      startWork(o); return 'Serviço iniciado';
    case 'aguardando_peca': attachNF(o); return 'Nota fiscal das peças anexada';
    case 'em_execucao': if(!o.fotosDepois.length) o.fotosDepois.push(makePhoto('Depois',140)); finishWork(o); return 'Profissional finalizou o serviço';
  }
  return null;
}
function simBar(o){
  if(!o.prov || !['agendado','a_caminho','no_local','aguardando_peca','em_execucao'].includes(o.status)) return '';
  const p=prov(o.prov);
  if(p.demo) return `<div class="banner info">${ic('sparkle')}<span class="grow">Agora é a vez de <b>${esc(p.curto)}</b>. Veja o outro lado do pedido.</span><button class="btn btn-dark xs" ${da('guideGo','profissional:'+p.id+':'+o.id)}>Abrir como ${esc(p.curto)}</button></div>`;
  return `<div class="banner info">${ic('sparkle')}<span class="grow">${esc(p.curto)} é um profissional simulado nesta demo.</span><button class="btn btn-dark xs" ${da('autoStep',o.id)}>Avançar etapa</button></div>`;
}

function postMsg(id, txt){
  const o=getO(id); const from=S.role==='cliente'?'cli':'prov'; o.chat.push({from, txt, t:Date.now()});
  const other = from==='cli' ? prov(o.prov) : null;
  if(from==='cli' && other && !other.demo) later(()=>{ o.chat.push({from:'prov', txt:['Combinado! Qualquer coisa me chame por aqui.','Certo, obrigado pelo aviso.','Estou a caminho, chego no horário.'][o.chat.length%3], t:Date.now()}); }, 1500);
  if(from==='prov' && o.synth) later(()=>{ o.chat.push({from:'cli', txt:['Ok, estou aguardando.','Pode subir, já avisei a portaria.','Perfeito, obrigado!'][o.chat.length%3], t:Date.now()}); }, 1500);
  render(); setTimeout(()=>{ window.scrollTo(0, document.body.scrollHeight); document.getElementById('msg')?.focus(); }, 0);
}
function getPhotoList(path){ if(path.startsWith('order:')){ const [,id,f]=path.split(':'); return getO(id)[f]; } return getPath(path); }
function addPhotos(path, urls){ const l=getPhotoList(path); l.push(...urls); render(); }

/* ================== EVENTOS ================== */
document.addEventListener('click', e=>{
  if(e.target.closest('[data-scrim]') && !e.target.closest('.sheet')){ closeSheet(); return; }
  const el=e.target.closest('[data-act]'); if(!el || el.tagName==='FORM') return;
  const fn=A[el.dataset.act]; if(!fn) return;
  e.preventDefault(); fn(el.dataset.arg ?? '');
});
document.addEventListener('submit', e=>{ const f=e.target; if(!f.dataset.act) return; e.preventDefault(); A[f.dataset.act]?.(f.dataset.arg ?? ''); });
document.addEventListener('input', e=>{
  const el=e.target;
  if(el.dataset.bind) setPath(el.dataset.bind, el.value);
  if(el.dataset.rerender && S.prov.diag){ const t=sum(S.prov.diag.itens.map(i=>+String(i.valor).replace(',','.')||0)); document.querySelectorAll('[data-dtotal]').forEach(x=>x.textContent=money(t)); document.querySelectorAll('[data-dnet]').forEach(x=>x.textContent=money(t*(1-S.db.pricing.comissao))); }
  if(el.dataset.ci!=null && el.value){ el.value=el.value.replace(/\D/g,'').slice(-1); const nx=el.nextElementSibling; if(nx && el.value) nx.focus(); }
});
document.addEventListener('keydown', e=>{
  const el=e.target; if(el.dataset && el.dataset.ci!=null && e.key==='Backspace' && !el.value){ el.previousElementSibling?.focus(); }
  if(e.key==='Escape' && S.ui.sheet) closeSheet();
});
document.addEventListener('change', e=>{
  const el=e.target;
  if(el.dataset.bind && el.tagName==='SELECT'){ setPath(el.dataset.bind, el.value); render(); }
  if(el.dataset.rerender) render();
  if(el.dataset.photos && el.files?.length){ const path=el.dataset.photos; const files=[...el.files].slice(0,6);
    Promise.all(files.map(f=>new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>res(null); r.readAsDataURL(f); }))).then(urls=>addPhotos(path, urls.filter(Boolean))); }
  if(el.dataset.file && el.files?.length){ setPath(el.dataset.file, el.files[0].name); render(); }
});
render();

/* ================== VOLTAR DO ANDROID ================== */
(function(){
  var cap = window.Capacitor;
  if (!cap || typeof cap.getPlatform !== 'function' || cap.getPlatform() !== 'android' || typeof cap.nativeCallback !== 'function') return;
  function atRoot(){
    var r = cur();
    if (r.stack && r.stack.length) return false;
    if (S.role === 'cliente') return S.client.screen === 'home';
    if (S.role === 'profissional') return S.prov.screen === 'pick' || S.prov.screen === 'home';
    return S.admin.screen === 'overview';
  }
  try {
    cap.nativeCallback('App', 'addListener', { eventName: 'backButton' }, function(){
      if (S.ui.sheet) { closeSheet(); return; }
      if (atRoot()) {
        try { var p = cap.nativePromise('App', 'minimizeApp', {}); if (p && p.catch) p.catch(function(){}); } catch (e) {}
        return;
      }
      back();
    });
  } catch (e) {}
})();
</script>
